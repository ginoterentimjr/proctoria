<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administração | Proctoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Poppins:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.topo{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:22px}
.topo h1{margin:0}
table.lista{width:100%;border-collapse:collapse;font-size:17px}
table.lista th{font:600 12px/1.2 var(--titulo);letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);text-align:left;padding:10px 12px 10px 0;border-bottom:2px solid var(--tinta)}
table.lista td{padding:13px 12px 13px 0;border-bottom:1px solid var(--linha);vertical-align:top;overflow-wrap:anywhere}
table.lista td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rolagem{overflow-x:auto}
.grupo{border-top:1px solid var(--linha);padding-top:20px;margin-top:24px;display:grid;gap:14px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px;align-items:start}
.questao{background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:18px;display:grid;gap:12px;margin-bottom:16px}
.questao header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.questao header b{font:600 19px/1.2 var(--titulo)}
.alt{display:grid;grid-template-columns:24px 28px minmax(0,1fr) auto;gap:10px;align-items:center}
.alt input[type=radio]{width:22px;height:22px;margin:0;accent-color:var(--laranja)}
.alt span{font:600 17px/1 var(--titulo)}
.vivo{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;align-items:start}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.cartao.urgente{border-color:var(--critico);box-shadow:inset 0 0 0 1px var(--critico)}
.cartao header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cartao header b{font:600 19px/1.25 var(--titulo);overflow-wrap:anywhere}
.cartao .imagens{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.cartao .imagens img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#1B1512;border-radius:4px;display:block}
.cartao .imagens img.tela{aspect-ratio:16/10;object-fit:contain}
.cartao .medidas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.cartao .medidas dt{font:600 11px/1.2 var(--titulo);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}
.cartao .medidas dd{margin:2px 0 0;font:600 18px/1.2 var(--titulo);font-variant-numeric:tabular-nums}
.cartao ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:16px}
.cartao ul li{padding-left:10px;border-left:3px solid var(--neutro)}
.cartao ul li.suspensao{border-left-color:var(--critico)}.cartao ul li.revisao{border-left-color:var(--atencao)}
.conversa{position:fixed;right:18px;bottom:18px;z-index:50;width:min(400px,calc(100vw - 36px));background:#1B1512;color:#FAF5EC;border-radius:6px;display:grid;box-shadow:0 12px 40px rgba(27,21,18,.4)}
.conversa header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.conversa header b{font:600 16px/1.2 var(--titulo)}
.conversa header button{font:600 14px/1 var(--titulo);background:transparent;color:#FAF5EC;border:1px solid rgba(250,245,236,.5);border-radius:4px;padding:7px 10px;cursor:pointer}
.conversa ol{list-style:none;margin:0;padding:6px 14px;max-height:320px;overflow-y:auto;display:grid;gap:8px;font-size:17px}
.conversa li{padding:8px 10px;border-radius:5px;background:rgba(250,245,236,.1);overflow-wrap:anywhere}
.conversa li.admin{background:rgba(229,102,44,.28)}
.conversa li small{display:block;font:600 11px/1.2 var(--titulo);letter-spacing:.08em;text-transform:uppercase;color:#C99A57;margin-bottom:2px}
.conversa form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 14px 14px}
.conversa form input{border:0}
.conversa form button{font:600 15px/1 var(--titulo);background:#E5662C;color:#1B1512;border:0;border-radius:4px;padding:0 16px;cursor:pointer}
.alerta-global{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:#8F2A19;color:#fff;border-radius:6px;padding:14px 18px;margin:0 0 22px}
.alerta-global[data-nivel="atencao"]{background:#1B1512}
.alerta-global p{margin:0;font:500 18px/1.4 var(--titulo);flex:1 1 420px}
.alerta-global .botao{background:#fff;color:#1B1512}
.consumo{width:100%;border-collapse:collapse;margin:8px 0 4px}
.consumo th,.consumo td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(27,21,18,.16);font-size:17px;vertical-align:top}
.consumo th{font:600 14px/1.3 var(--titulo);letter-spacing:.06em;text-transform:uppercase}
.consumo td.n,.consumo th.n{text-align:right;white-space:nowrap}
.consumo tfoot td{font:600 19px/1.3 var(--titulo);border-bottom:0}
.aviso-topo{background:var(--papel);border-left:5px solid var(--ouro);padding:12px 16px;margin:0 0 20px;font-size:17px}
code.chave{font:500 15px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--linha);border-radius:4px;padding:6px 8px;display:inline-block;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
</style>
</head>
<body>
<div class="pagina larga">
  <header class="marca"><b>Proctoria</b><span>Administração</span>
    <nav id="menu" hidden>
      <button class="botao sec menor" type="button" data-vista="provas">Provas</button>
      <button class="botao sec menor" type="button" data-vista="vivo">Acompanhamento</button>
      <button class="botao sec menor" type="button" data-vista="sessoes">Sessões e auditoria</button>
      <button class="botao sec menor" type="button" data-vista="config">Configurações</button>
      <button class="botao sec menor" type="button" id="sair">Sair</button>
    </nav>
  </header>
  <div class="alerta-global" id="alerta-global" role="alert" hidden><p id="alerta-texto"></p><button class="botao menor" type="button" id="alerta-config">Abrir as configurações</button></div>
  <main id="conteudo"></main>
</div>
<div class="conversa" id="conversa" hidden>
  <header><b id="conversa-nome"></b><button type="button" id="conversa-fechar">Fechar</button></header>
  <ol id="conversa-lista" aria-live="polite"></ol>
  <form id="conversa-form"><input type="text" id="conversa-texto" maxlength="500" autocomplete="off" aria-label="Mensagem ao participante"><button type="submit">Enviar</button></form>
</div>

<script src="painel.js"></script>
<script src="relatorio.js"></script>
<script>
(function () {

    rosto_ausente: "rosto fora da imagem", mais_de_um_rosto: "mais de um rosto", voz: "som de voz", reincidencia: "reincidência de advertências", queda: "sessão interrompida", administrador: "determinação do administrador" };
